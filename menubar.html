<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABC Limited Company</title>
<style>
    body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background: #f5f5f5;
    }

    .menu {
        margin-bottom: 20px;
    }

    .menu a {
        display: inline-block;
        padding: 10px 15px;
        margin-right: 10px;
        text-decoration: none;
        background-color: #007bff;
        color: white;
        border-radius: 5px;
        font-weight: bold;
    }

    .menu a:hover {
        background-color: #0056b3;
    }

    table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 20px;
    }

    th, td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: center;
    }

    th {
        background-color: #f2f2f2;
    }

    .add-btn {
        padding: 5px 10px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 3px;
        cursor: pointer;
    }

    .add-btn:hover {
        background-color: #218838;
    }

    .book-btn {
        background-color: #ffc107;
        color: #000;
    }

    .book-btn:hover {
        background-color: #e0a800;
    }

    footer {
        margin-top: 20px;
        text-align: center;
    }

    .location-btn {
        display: inline-block;
        padding: 8px 12px;
        background-color: #17a2b8;
        color: white;
        text-decoration: none;
        border-radius: 4px;
    }

    .location-btn:hover {
        background-color: #138496;
    }
</style>
</head>
<body>

<div class="menu">
  <a href="#">Home</a>
  <a href="#">Subject</a>
  <a href="#">Payment</a>
  <a href="#">Login</a>
</div>

<table border="1" cellpadding="8">
  <tr>
    <th>S.No</th>
    <th>Subject</th>
    <th>Price</th>
    <th>Book</th>
    <th>Add to Cart</th>
  </tr>
  <tr>
    <td>1</td>
    <td>Physics</td>
    <td>350</td>
    <td><button class="book-btn">1</button></td>
    <td><button class="add-btn">Click me</button></td>
  </tr>
  <tr>
    <td>2</td>
    <td>Chemistry</td>
    <td>450</td>
    <td><button class="book-btn">2</button></td>
    <td><button class="add-btn">Click me</button></td>
  </tr>
  <tr>
    <td>3</td>
    <td>Biology</td>
    <td>200</td>
    <td><button class="book-btn">3</button></td>
    <td><button class="add-btn">Click me</button></td>
  </tr>
  <tr>
    <td>4</td>
    <td>Maths</td>
    <td>300</td>
    <td><button class="book-btn">4</button></td>
    <td><button class="add-btn">Click me</button></td>
  </tr>
  <tr>
    <td>5</td>
    <td>English</td>
    <td>400</td>
    <td><button class="book-btn">5</button></td>
    <td><button class="add-btn">Click me</button></td>
  </tr>
</table>

<br>

<p>
  <b>Logo</b> ABC Limited Company
  &nbsp;&nbsp;
  <a class="location-btn" href="https://maps.google.com" target="_blank">Location (Google Map)</a>
</p>

</body>
</html>
